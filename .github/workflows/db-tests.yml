# DB tests (docs/tests/db/README.md): repository code against a throwaway MariaDB
# built from the production schema and migrations.
# Called by main.yml before the release images are built; can be run by hand on any branch.
name: db-tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: nextjs/package.json   # pnpm version from the packageManager field
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start test database and apply migrations
        run: pnpm test:db:up
      - name: Run DB tests
        run: pnpm test:db
      - name: Stop test database
        if: ${{ always() }}
        run: pnpm test:db:down
